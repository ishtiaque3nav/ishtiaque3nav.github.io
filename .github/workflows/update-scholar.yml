name: Portfolio and daily Scholar refresh

on:
  push:
    branches: [main]
  schedule:
    # Daily at 13:17 UTC; scheduled workflows may start later than this.
    - cron: '17 13 * * *'
  workflow_dispatch:

# Updating the JSON from GITHUB_TOKEN does not trigger another push workflow.
concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import uploaded Michigan seal artwork
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[import-umich-seal]')
        run: |
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 12 --max-time 60 \
            --user-agent 'PortfolioSiteUpdater/1.0 (personal site image)' \
            --output assets/umich-seal.svg \
            'https://upload.wikimedia.org/wikipedia/commons/9/93/Seal_of_the_University_of_Michigan.svg'
          python - <<'PY'
          from pathlib import Path
          data=Path("assets/umich-seal.svg").read_bytes()
          assert 20000 < len(data) < 200000, "Unexpected image size"
          assert b'<svg' in data and b'</svg>' in data, "Not valid SVG"
          assert b'<script' not in data.lower(), "Active SVG content"
          print("Verified transparent university seal SVG, bytes:",len(data))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/umich-seal.svg
          git commit -m 'Add vector University of Michigan seal'
          git push origin HEAD:main
      - name: Test Scholar parser (no API request)
        run: python -m unittest discover -s tests -v
      - name: Validate last verified snapshot (no API request)
        run: python scripts/update_scholar.py --check-file
      - name: Fetch and verify daily Scholar metrics
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[scholar-refresh]')
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_scholar.py
      - name: Commit verified metrics to main
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[scholar-refresh]')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/scholar.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified all-time Scholar metrics'
            git push origin HEAD:main
          fi
      - name: Prepare only public static website files
        run: |
          mkdir -p _site
          cp index.html style.css script.js .nojekyll favicon.svg file.svg globe.svg window.svg robots.txt sitemap.xml google94416b65d006b292.html _site/
          test "$(cat _site/google94416b65d006b292.html)" = 'google-site-verification: google94416b65d006b292.html'
          cp -R assets api _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
