name: Portfolio and daily Scholar refresh

on:
  push:
    branches: [main]
  schedule:
    # Daily at 13:17 UTC; scheduled workflows may start later than this.
    - cron: '17 13 * * *'
  workflow_dispatch:

# Updating the JSON from GITHUB_TOKEN does not trigger another push workflow.
concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Scholar parser (no API request)
        run: python -m unittest discover -s tests -v
      - name: Validate last verified snapshot (no API request)
        run: python scripts/update_scholar.py --check-file
      - name: Fetch and verify daily Scholar metrics
        if: github.event_name != 'push'
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_scholar.py
      - name: Commit verified metrics to main
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/scholar.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified all-time Scholar metrics'
            git push origin HEAD:main
          fi
      - name: Prepare only public static website files
        run: |
          mkdir -p _site
          cp index.html style.css script.js .nojekyll favicon.svg file.svg globe.svg window.svg _site/
          cp -R assets api _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
