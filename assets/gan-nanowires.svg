<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09152a"/><stop offset="1" stop-color="#0a3d4b"/></linearGradient>
 <linearGradient id="wire" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#3cc9ff"/><stop offset=".55" stop-color="#8af4ff"/><stop offset="1" stop-color="#d9fbff"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff7b1"/><stop offset=".3" stop-color="#ffe86b" stop-opacity=".8"/><stop offset="1" stop-color="#ffe86b" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
 <pattern id="hex" width="48" height="42" patternUnits="userSpaceOnUse"><path d="M12 1h24l12 20-12 20H12L0 21z" fill="none" stroke="#a9f2ff" stroke-opacity=".09"/></pattern>
</defs>
<rect width="1200" height="760" rx="42" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="704" rx="32" fill="url(#hex)"/>
<text x="72" y="88" fill="#a7f5ff" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">III-NITRIDE NANOSTRUCTURES</text>
<text x="72" y="124" fill="#c7d8e5" font-family="Arial,sans-serif" font-size="17">Conceptual GaN / InGaN nanowire heterostructure</text>

<!-- sunlight -->
<circle cx="1020" cy="150" r="150" fill="url(#sun)" filter="url(#blur)"/>
<circle cx="1020" cy="150" r="72" fill="#fff4a5" opacity=".92"/>
<g stroke="#ffe77a" stroke-width="7" stroke-linecap="round" opacity=".7">
 <path d="M1020 40v-38M1020 298v38M910 150h-38M1130 150h38M942 72l-28-28M1098 228l28 28M1098 72l28-28M942 228l-28 28"/>
</g>

<!-- substrate -->
<path d="M120 565 L1080 565 L1000 670 L200 670 Z" fill="#18394a" stroke="#5f8da0" stroke-width="3"/>
<path d="M120 565 L1080 565 L1050 605 L150 605 Z" fill="#29556a"/>
<text x="150" y="650" fill="#8eb6c5" font-family="Arial,sans-serif" font-size="16">Si / template substrate</text>

<!-- nanowires -->
<g>
 <g fill="url(#wire)" stroke="#bff8ff" stroke-width="2">
  <path d="M200 565 L225 245 L250 565 Z"/><path d="M290 565 L315 185 L340 565 Z"/><path d="M380 565 L405 270 L430 565 Z"/>
  <path d="M470 565 L495 150 L520 565 Z"/><path d="M560 565 L585 220 L610 565 Z"/><path d="M650 565 L675 175 L700 565 Z"/>
  <path d="M740 565 L765 250 L790 565 Z"/><path d="M830 565 L855 190 L880 565 Z"/><path d="M920 565 L945 270 L970 565 Z"/>
 </g>
 <g stroke="#d9ffff" stroke-width="6" opacity=".45">
  <path d="M225 245L225 565"/><path d="M315 185L315 565"/><path d="M405 270L405 565"/><path d="M495 150L495 565"/><path d="M585 220L585 565"/><path d="M675 175L675 565"/><path d="M765 250L765 565"/><path d="M855 190L855 565"/><path d="M945 270L945 565"/>
 </g>
</g>

<!-- photons -->
<g stroke="#fff2a6" stroke-width="4" stroke-linecap="round" opacity=".8">
 <path d="M1000 245L920 310"/><path d="M1050 270L970 335"/><path d="M930 220L850 285"/><path d="M1090 230L1010 295"/>
</g>
<g font-family="Arial,sans-serif">
 <text x="72" y="210" fill="#d8faff" font-size="18" font-weight="700">Epitaxy</text>
 <text x="72" y="236" fill="#8eafbc" font-size="14">controlled growth of low-dimensional III-nitrides</text>
 <text x="72" y="270" fill="#d8faff" font-size="18" font-weight="700">Optoelectronics</text>
 <text x="72" y="296" fill="#8eafbc" font-size="14">light absorption • emission • carrier dynamics</text>
</g>
</svg>
