<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#102a3d"/></linearGradient>
  <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#54e1ff"/><stop offset=".5" stop-color="#9ef5ff"/><stop offset="1" stop-color="#4ca7ff"/></linearGradient>
  <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6e5ef"/><stop offset="1" stop-color="#70859a"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#7cc7e6" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1200" height="760" rx="42" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="704" rx="32" fill="url(#grid)"/>
<text x="72" y="88" fill="#9ceeff" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">ADVANCED LOGIC / GAA NANOSHEET</text>
<text x="72" y="124" fill="#c7d8e5" font-family="Arial,sans-serif" font-size="17">Conceptual device visualization — stacked channels wrapped by the gate</text>

<!-- substrate -->
<path d="M180 600 L930 600 L1060 675 L310 675 Z" fill="#263c4e" stroke="#547184" stroke-width="3"/>
<path d="M180 600 L930 600 L930 650 L180 650 Z" fill="#182b3b"/>
<text x="194" y="695" fill="#8da8b8" font-family="Arial,sans-serif" font-size="16">silicon / isolation</text>

<!-- source drain -->
<path d="M170 260 L320 260 L320 555 L170 555 Z" fill="#3f5667" stroke="#90a9ba" stroke-width="3"/>
<path d="M850 260 L1000 260 L1000 555 L850 555 Z" fill="#3f5667" stroke="#90a9ba" stroke-width="3"/>
<text x="186" y="292" fill="#dceaf2" font-family="Arial,sans-serif" font-size="18" font-weight="700">SOURCE</text>
<text x="876" y="292" fill="#dceaf2" font-family="Arial,sans-serif" font-size="18" font-weight="700">DRAIN</text>

<!-- nanosheets -->
<g filter="url(#glow)">
 <rect x="295" y="330" width="610" height="54" rx="12" fill="url(#sheet)" opacity=".95"/>
 <rect x="295" y="410" width="610" height="54" rx="12" fill="url(#sheet)" opacity=".95"/>
 <rect x="295" y="490" width="610" height="54" rx="12" fill="url(#sheet)" opacity=".95"/>
</g>
<text x="520" y="365" fill="#062131" font-family="Arial,sans-serif" font-size="17" font-weight="700">NANOSHEET CHANNEL</text>
<text x="520" y="445" fill="#062131" font-family="Arial,sans-serif" font-size="17" font-weight="700">NANOSHEET CHANNEL</text>
<text x="520" y="525" fill="#062131" font-family="Arial,sans-serif" font-size="17" font-weight="700">NANOSHEET CHANNEL</text>

<!-- gate surround -->
<path d="M390 205 Q360 205 360 235 L360 560 Q360 590 390 590 L810 590 Q840 590 840 560 L840 235 Q840 205 810 205 Z M430 245 L770 245 Q790 245 790 265 L790 530 Q790 550 770 550 L430 550 Q410 550 410 530 L410 265 Q410 245 430 245 Z" fill="url(#gate)" fill-rule="evenodd" stroke="#e4f0f6" stroke-width="3" opacity=".88"/>
<text x="470" y="190" fill="#eef8fc" font-family="Arial,sans-serif" font-size="21" font-weight="700">GATE-ALL-AROUND</text>

<!-- inner spacer -->
<g fill="#a5b9c6" opacity=".9">
 <rect x="318" y="312" width="52" height="20" rx="5"/><rect x="830" y="312" width="52" height="20" rx="5"/>
 <rect x="318" y="392" width="52" height="20" rx="5"/><rect x="830" y="392" width="52" height="20" rx="5"/>
 <rect x="318" y="472" width="52" height="20" rx="5"/><rect x="830" y="472" width="52" height="20" rx="5"/>
</g>

<!-- callouts -->
<g font-family="Arial,sans-serif">
 <path d="M985 170 L865 245" stroke="#7feaff" stroke-width="2"/><circle cx="985" cy="170" r="5" fill="#7feaff"/>
 <text x="1000" y="165" fill="#d7f8ff" font-size="17" font-weight="700">Gate stack</text>
 <text x="1000" y="188" fill="#8fa9b8" font-size="14">electrostatic control</text>
 <path d="M130 420 L295 438" stroke="#7feaff" stroke-width="2"/><circle cx="130" cy="420" r="5" fill="#7feaff"/>
 <text x="72" y="398" fill="#d7f8ff" font-size="17" font-weight="700">Stacked channels</text>
 <text x="72" y="421" fill="#8fa9b8" font-size="14">area-efficient architecture</text>
</g>
</svg>
