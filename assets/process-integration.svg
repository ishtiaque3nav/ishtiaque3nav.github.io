<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090e1c"/><stop offset="1" stop-color="#1b1d35"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8a9db2"/><stop offset=".5" stop-color="#e1edf5"/><stop offset="1" stop-color="#65788e"/></linearGradient>
 <linearGradient id="dielectric" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c18cff"/><stop offset="1" stop-color="#6b48b8"/></linearGradient>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#a6b8ff" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="760" rx="42" fill="url(#bg)"/>
<rect x="30" y="30" width="1140" height="700" rx="32" fill="url(#grid)"/>
<text x="72" y="88" fill="#c9c4ff" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">DEVICE + PROCESS INTEGRATION</text>
<text x="72" y="124" fill="#c7d8e5" font-family="Arial,sans-serif" font-size="17">Conceptual cross-section linking FEOL device structure to BEOL interconnect</text>

<!-- BEOL stack -->
<g>
 <rect x="110" y="170" width="980" height="62" rx="10" fill="#2e3855" stroke="#697a9b"/>
 <rect x="110" y="232" width="980" height="62" rx="10" fill="#242d45" stroke="#697a9b"/>
 <rect x="110" y="294" width="980" height="62" rx="10" fill="#1e273b" stroke="#697a9b"/>
 <g fill="url(#metal)"><rect x="250" y="168" width="26" height="190"/><rect x="550" y="168" width="26" height="190"/><rect x="850" y="168" width="26" height="190"/></g>
 <text x="900" y="208" fill="#a9b8cf" font-family="Arial,sans-serif" font-size="15">BEOL interconnect</text>
</g>

<!-- contacts -->
<rect x="250" y="355" width="120" height="105" fill="url(#metal)" stroke="#e5eff5" stroke-width="3"/>
<rect x="830" y="355" width="120" height="105" fill="url(#metal)" stroke="#e5eff5" stroke-width="3"/>
<text x="267" y="415" fill="#172231" font-family="Arial,sans-serif" font-size="16" font-weight="700">SOURCE</text>
<text x="854" y="415" fill="#172231" font-family="Arial,sans-serif" font-size="16" font-weight="700">DRAIN</text>

<!-- gate stack -->
<path d="M415 370 Q400 370 400 390 L400 525 Q400 545 420 545 L780 545 Q800 545 800 525 L800 390 Q800 370 780 370 Z" fill="url(#metal)" stroke="#e6f0f6" stroke-width="3"/>
<path d="M450 398 Q440 398 440 410 L440 510 Q440 520 452 520 L748 520 Q760 520 760 510 L760 410 Q760 398 748 398 Z" fill="url(#dielectric)" opacity=".88"/>

<!-- nanosheets -->
<g fill="#65e9ff" stroke="#d6fbff" stroke-width="2">
 <rect x="350" y="420" width="500" height="24" rx="8"/><rect x="350" y="462" width="500" height="24" rx="8"/><rect x="350" y="504" width="500" height="24" rx="8"/>
</g>
<text x="535" y="446" fill="#062531" font-family="Arial,sans-serif" font-size="13" font-weight="700">CHANNEL</text>
<text x="535" y="488" fill="#062531" font-family="Arial,sans-serif" font-size="13" font-weight="700">CHANNEL</text>
<text x="535" y="530" fill="#062531" font-family="Arial,sans-serif" font-size="13" font-weight="700">CHANNEL</text>

<!-- labels -->
<g font-family="Arial,sans-serif">
 <path d="M150 530 L400 485" stroke="#b9aaff" stroke-width="2"/><text x="75" y="565" fill="#d7d2ff" font-size="18" font-weight="700">FEOL</text><text x="75" y="590" fill="#929ab7" font-size="14">device formation</text>
 <path d="M900 530 L1050 485" stroke="#b9aaff" stroke-width="2"/><text x="900" y="565" fill="#d7d2ff" font-size="18" font-weight="700">BEOL</text><text x="900" y="590" fill="#929ab7" font-size="14">interconnect + power</text>
 <text x="470" y="625" fill="#e6e8f3" font-size="18" font-weight="700">nanosheet / gate stack / contacts</text>
</g>
</svg>
